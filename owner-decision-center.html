<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEGEV BOQ — מרכז החלטות</title><style>*{box-sizing:border-box}body{margin:0;background:#061321;color:#eef7ff;font-family:Arial,sans-serif}.w{max-width:1380px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.badge{padding:8px 13px;border:1px solid #2a6da5;border-radius:99px;color:#7fc7ff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.c{background:#0c2036;border:1px solid #1b3d5b;border-radius:16px;padding:17px}.label{color:#93acc3;font-size:13px}.n{font-size:26px;font-weight:800;margin-top:8px}.g{color:#48dfa0}.y{color:#ffc357}.r{color:#ff6673}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1689e8;color:#fff;font-weight:700;cursor:pointer}.actions .item,.risks .item{padding:13px 0;border-bottom:1px solid #1b3d5b}.item:last-child{border-bottom:0}.big{font-size:19px;line-height:1.65}.status{font-weight:800}.muted{color:#93acc3}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{color:#dff1ff;text-decoration:none;background:#17314a;padding:9px 11px;border-radius:9px}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="top"><div><h1>מרכז החלטות לבעל החברה</h1><div class="muted">SEGEV BOQ · רווחיות + תזרים + Break-Even + פעולה להיום</div></div><span class="badge">DEV</span></div><div class="cards"><div class="c"><div class="label">רווח צפוי</div><div class="n" id="profit">—</div></div><div class="c"><div class="label">כסף בסיכון</div><div class="n r" id="risk">—</div></div><div class="c"><div class="label">מימון מרבי</div><div class="n r" id="funding">—</div><div class="label" id="fundingMonth"></div></div><div class="c"><div class="label">Break-Even</div><div class="n y" id="be">—</div></div><div class="c"><div class="label">מצב תזרים</div><div class="n status" id="cashStatus">—</div></div></div><div class="grid"><section class="c"><h2>מה קורה עכשיו?</h2><div class="big" id="summary"></div><h3>3 פעולות להיום</h3><div class="actions" id="actions"></div></section><section class="c"><h2>סיכונים מרכזיים</h2><div class="risks" id="risks"></div><div class="links"><a href="cashflow-breakeven.html">פתח תזרים</a><a href="profit-radar-2.html">פתח Profit Radar</a><a href="project-finance-data.html">נתונים פיננסיים</a></div></section></div></main><script>const $=id=>document.getElementById(id);const money=n=>'₪'+Math.round(Math.abs(+n||0)).toLocaleString('he-IL');function load(){const pr=JSON.parse(localStorage.getItem('segevProfitRadar2')||'{}');const cf=JSON.parse(localStorage.getItem('segevCashflowBreakeven')||'{}');const forecast=+pr.forecast||0,risk=+pr.risk||0,maxF=+cf.maxFunding||0,end=+cf.endingBalance||0,be=cf.breakEven||'—',fm=cf.maxFundingMonth||'—';$('profit').textContent=money(forecast);$('profit').className='n '+(forecast>=0?'g':'r');$('risk').textContent=money(risk);$('funding').textContent=money(maxF);$('fundingMonth').textContent=fm!=='—'?'שיא: '+fm:'';$('be').textContent=be;const st=maxF<=0?'🟢 ללא צורך במימון':(end<0?'🔴 עדיין במימון':'🟡 בדרך ל-Break-Even');$('cashStatus').textContent=st;$('cashStatus').className='n status '+(maxF<=0?'g':end<0?'r':'y');const project=pr.project||'הפרויקט';$('summary').innerHTML=`ב-${project} הרווח הצפוי הוא <b class="${forecast>=0?'g':'r'}">${money(forecast)}</b>. המימון המרבי הצפוי הוא <b class="r">${money(maxF)}</b>${fm!=='—'?` בחודש <b>${fm}</b>`:''}. ${be!=='—'?`נקודת ה-Break-Even צפויה ב-<b class="g">${be}</b>.`:'לפי הנתונים הנוכחיים עדיין אין Break-Even בתקופת התחזית.'}`;const acts=[];if(maxF>0)acts.push(`להבטיח מסגרת מימון של לפחות ${money(maxF)} לפני חודש השיא.`);if(risk>0)acts.push(`לטפל בסיכון כספי של ${money(risk)} לפני החשבון הקרוב.`);if(be==='—')acts.push('להאיץ תקבולים או לדחות תשלומים כדי להחזיר את הפרויקט ל-Break-Even.');else acts.push(`לשמור על מסלול התקבולים כדי לא לדחות את Break-Even מעבר ל-${be}.`);$('actions').innerHTML=acts.slice(0,3).map((x,i)=>`<div class="item"><b>${i+1}.</b> ${x}</div>`).join('');const rs=[{t:'מימון מרבי',v:maxF},{t:'כסף בסיכון',v:risk},{t:'יתרה מצטברת בסוף התחזית',v:Math.abs(end),neg:end<0}].sort((a,b)=>b.v-a.v);$('risks').innerHTML=rs.map(x=>`<div class="item"><b>${x.t}</b><div class="${x.neg||x.t!=='יתרה מצטברת בסוף התחזית'?'r':'g'}">${x.neg?'-':''}${money(x.v)}</div></div>`).join('')}load();window.addEventListener('storage',load);</script></body></html>
