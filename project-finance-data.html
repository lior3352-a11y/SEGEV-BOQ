<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEGEV BOQ — נתוני תזרים</title><style>*{box-sizing:border-box}body{margin:0;background:#071526;color:#eaf4ff;font-family:Arial,sans-serif}.w{max-width:1350px;margin:auto;padding:28px}.card{background:#0c2036;border:1px solid #193b5a;border-radius:16px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}label{font-size:13px;color:#a9bdd0}input,select{width:100%;margin-top:5px;background:#071526;color:#fff;border:1px solid #285071;border-radius:8px;padding:9px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1689e8;color:#fff;font-weight:700;cursor:pointer}.alt{background:#18324b}.rows{margin-top:12px}.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1fr .35fr;gap:8px;margin:7px 0}.note{color:#91a9bf}.ok{color:#48dfa0;font-weight:700}@media(max-width:800px){.grid,.row{grid-template-columns:1fr 1fr}}</style></head><body><main class="w"><div class="top"><div><h1>שכבת נתונים פיננסית לפרויקט</h1><div class="note">מקור משותף למנוע התזרים, Break-Even ו-Profit Radar</div></div><b>DEV</b></div><section class="card"><h2>חשבון היזם</h2><div class="grid"><label>חודש ביצוע<input id="clientWorkMonth" type="month" value="2026-09"></label><label>סכום חשבון ₪<input id="clientAmount" type="number" value="800000"></label><label>מועד תקבול חוזי<input id="clientReceipt" type="date" value="2026-10-31"></label><label>סטטוס<select id="clientStatus"><option>תחזית</option><option>הוגש</option><option>אושר</option><option>שולם</option></select></label><label>הערה<input id="clientNote" value="חשבון חודשי"></label></div><br><button class="btn" onclick="addClient()">הוסף חשבון יזם</button><div class="rows" id="clients"></div></section><section class="card"><h2>קבלני משנה וספקים</h2><p class="note">ברירת המחדל: תשלום 15 יום ממועד קבלת התשלום החוזי מהיזם.</p><div class="grid"><label>סוג<select id="partyType"><option>קבלן משנה</option><option>ספק</option></select></label><label>שם<input id="partyName" value="קבלן לדוגמה"></label><label>חודש ביצוע<input id="partyMonth" type="month" value="2026-09"></label><label>סכום ₪<input id="partyAmount" type="number" value="450000"></label><label>מועד תקבול מהיזם<input id="linkedReceipt" type="date" value="2026-10-31"></label></div><br><button class="btn" onclick="addParty()">הוסף התחייבות</button><div class="rows" id="parties"></div></section><section class="card"><button class="btn" onclick="save()">שמור וחבר למנוע התזרים</button> <button class="btn alt" onclick="resetAll()">איפוס</button><p id="status" class="ok"></p></section></main><script>const $=x=>document.getElementById(x);let db=JSON.parse(localStorage.getItem('segevProjectFinanceData')||'{"clientInvoices":[],"partyPayments":[]}');const plus15=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+15);return x.toISOString().slice(0,10)};function addClient(){db.clientInvoices.push({workMonth:$('clientWorkMonth').value,amount:+$('clientAmount').value||0,contractReceiptDate:$('clientReceipt').value,status:$('clientStatus').value,note:$('clientNote').value});save()}function addParty(){const receipt=$('linkedReceipt').value;db.partyPayments.push({type:$('partyType').value,name:$('partyName').value,workMonth:$('partyMonth').value,amount:+$('partyAmount').value||0,linkedClientReceiptDate:receipt,paymentDate:receipt?plus15(receipt):'',terms:'15 days after contractual client receipt'});save()}function del(k,i){db[k].splice(i,1);save()}function save(){localStorage.setItem('segevProjectFinanceData',JSON.stringify({...db,updatedAt:new Date().toISOString()}));render();$('status').textContent='הנתונים נשמרו. מנוע התזרים יכול לקרוא אותם מאותו מקור.'}function resetAll(){db={clientInvoices:[],partyPayments:[]};save()}function render(){$('clients').innerHTML=db.clientInvoices.map((x,i)=>`<div class="row"><span>${x.workMonth}</span><span>₪${x.amount.toLocaleString('he-IL')}</span><span>תקבול: ${x.contractReceiptDate}</span><span>${x.status}</span><span>${x.note}</span><button onclick="del('clientInvoices',${i})">×</button></div>`).join('')||'<span class="note">אין חשבונות עדיין</span>';$('parties').innerHTML=db.partyPayments.map((x,i)=>`<div class="row"><span>${x.type}: ${x.name}</span><span>₪${x.amount.toLocaleString('he-IL')}</span><span>ביצוע: ${x.workMonth}</span><span>תשלום: ${x.paymentDate}</span><span>+15 יום מתקבול יזם</span><button onclick="del('partyPayments',${i})">×</button></div>`).join('')||'<span class="note">אין התחייבויות עדיין</span>'}render();</script></body></html>
