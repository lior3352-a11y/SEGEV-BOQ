<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEGEV BOQ — Smart Guidance</title><style>*{box-sizing:border-box}body{margin:0;background:#071526;color:#eaf4ff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:28px}.card{background:#0c2036;border:1px solid #193b5a;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1689e8;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#18324b}.banner{border-radius:14px;padding:16px;margin-top:14px;display:none}.banner.show{display:block}.info{background:#102e49;border:1px solid #2364aa}.warn{background:#3a2a0d;border:1px solid #b87816}.block{background:#42141a;border:1px solid #b53b48}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:#91a9bf}.rule{padding:12px 0;border-bottom:1px solid #193b5a}.rule:last-child{border:0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>SEGEV Smart Guidance</h1><p class="muted">עזרה חכמה בזמן עבודה — מסבירה מה לא נכון, למה, ומה לעשות עכשיו.</p><section class="card"><h2>תרחישי בדיקה</h2><div class="grid"><button class="btn" onclick="guide('variation')">עבודה נוספת בלי אישור</button><button class="btn" onclick="guide('subcontractor')">חשבון קבלן בלי תנאי תשלום</button><button class="btn" onclick="guide('supplier')">חשבונית ספק בלי הזמנה/אספקה</button><button class="btn" onclick="guide('budget')">חריגה מתקציב</button><button class="btn" onclick="guide('permission')">פעולה ללא הרשאה</button><button class="btn" onclick="guide('contract')">שינוי נתון חוזי ללא תיעוד</button></div><div id="banner" class="banner"></div></section><section class="card"><h2>כללי Smart Guidance — גרסה 1</h2><div id="rules"></div></section></main><script>const RULES={variation:{level:'block',title:'העבודה עדיין לא מאושרת',text:'אין להתחיל בביצוע עבודה נוספת לפני אישור הגורם המוסמך ותיעוד הסכום המאושר.',why:'ביצוע ללא אישור עלול ליצור עבודה שלא ניתן לחייב עליה.',action:'פתח בקשת שינוי והשלם אישור'},subcontractor:{level:'block',title:'חסרים תנאי תשלום בהסכם',text:'לא ניתן לאשר חשבון קבלן משנה לפני שמוגדרים תנאי התשלום בהסכם.',why:'המערכת חייבת לדעת מתי ההתחייבות הופכת לתשלום כדי לחשב תזרים נכון.',action:'פתח הסכם קבלן משנה'},supplier:{level:'warn',title:'אין התאמה מלאה למסמכי הרכש',text:'החשבונית אינה תואמת הזמנת רכש ואישור אספקה.',why:'אישור ללא התאמה עלול ליצור תשלום כפול או חריגה מהזמנה.',action:'בדוק הזמנה ואספקה'},budget:{level:'warn',title:'הפעולה יוצרת חריגה מהתקציב',text:'ההתחייבות החדשה חורגת מהיתרה הזמינה בסעיף.',why:'החריגה תשפיע על הרווח הצפוי ועל Profit Radar.',action:'פתח בדיקת תקציב'},permission:{level:'block',title:'אין הרשאה לפעולה זו',text:'התפקיד שלך אינו מורשה לבצע את השינוי המבוקש.',why:'פעולות פיננסיות וחוזיות מוגבלות לפי הרשאות.',action:'פנה למשתמש מורשה'},contract:{level:'block',title:'שינוי חוזי דורש תיעוד',text:'לא ניתן לעדכן נתון חוזי בלי סיבה, תאריך ומשתמש מבצע.',why:'המערכת שומרת את החוזה המקורי ואת היסטוריית השינויים.',action:'פתח טופס שינוי מתועד'}};function guide(k){const r=RULES[k],b=document.getElementById('banner');b.className='banner show '+r.level;b.innerHTML=`<h3>${r.title}</h3><p>${r.text}</p><p><b>למה?</b> ${r.why}</p><div class="actions"><button class="btn" onclick="fix('${k}')">תקן עכשיו</button><button class="btn alt" onclick="closeBanner()">סגור</button></div>`;localStorage.setItem('segevSmartGuidanceLast',JSON.stringify({rule:k,shownAt:new Date().toISOString()}))}function fix(k){const r=RULES[k];alert('מעבר למסך המתאים: '+r.action)}function closeBanner(){document.getElementById('banner').className='banner'}document.getElementById('rules').innerHTML=Object.values(RULES).map(r=>`<div class="rule"><b>${r.title}</b><div class="muted">${r.text}</div></div>`).join('');</script></body></html>
