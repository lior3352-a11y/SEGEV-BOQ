<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEGEV BOQ 1.0</title><style>:root{--n:#142033;--g:#d9952f;--b:#f4f6f9;--l:#e4e7ec;--t:#101828;--m:#667085;--r:#c83c3c;--gr:#16845b}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--b);color:var(--t)}button,input{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:var(--n);color:#fff;padding:22px 16px}.brand{font-size:22px;font-weight:900;margin-bottom:24px}.brand span{color:var(--g)}nav{display:grid;gap:7px}.nav{border:0;background:transparent;color:#dbe3ee;padding:12px;border-radius:8px;text-align:right;font-weight:700;cursor:pointer}.nav.active,.nav:hover{background:#ffffff18}main{padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1,h2{margin:0 0 12px}.sub{color:var(--m);font-size:13px}.btn{border:1px solid var(--l);background:#fff;padding:10px 13px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary{background:var(--g);border-color:var(--g)}.btn.danger{color:var(--r)}.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.view{display:none}.view.active{display:block}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form input{padding:9px;border:1px solid #d0d5dd;border-radius:7px}.wide{grid-column:span 2}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--l);border-radius:8px;padding:11px}.row.active{border-color:var(--g)}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}th{color:var(--m);font-size:13px}.wrap{overflow:auto}.good{color:var(--gr)}.bad{color:var(--r)}.empty{text-align:center;color:var(--m);padding:20px}@media(max-width:850px){.app{grid-template-columns:1fr}aside{padding:10px;position:sticky;top:0;z-index:5}.brand{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:12px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="app"><aside><div class="brand"><span>SEGEV</span> BOQ 1.0</div><nav><button class="nav active" data-v="dash">מרכז שליטה</button><button class="nav" data-v="projects">פרויקטים</button><button class="nav" data-v="boq">כתב כמויות</button><button class="nav" data-v="cost">תקציב מול ביצוע</button></nav></aside><main><div class="top"><div><h1 id="title">מרכז שליטה</h1><div class="sub" id="sel">אין פרויקט נבחר</div></div><div><button class="btn" id="backup">גיבוי</button> <label class="btn" for="restore">שחזור</label><input id="restore" type="file" accept=".json" hidden> <button class="btn primary" onclick="show('projects')">+ פרויקט חדש</button></div></div><section id="dash" class="view active"><div class="metrics"><div class="card metric">תקציב<b id="db">₪0</b></div><div class="card metric">ביצוע בפועל<b id="da">₪0</b></div><div class="card metric">סטייה<b id="dv">₪0</b></div><div class="card metric">התקדמות<b id="dp">0%</b></div></div><div class="card" id="summary"><div class="empty">צור פרויקט ראשון כדי להתחיל לעבוד.</div></div></section><section id="projects" class="view"><div class="grid"><div class="card"><h2>הפרויקטים שלי</h2><div id="plist" class="list"></div></div><div class="card"><h2>פרויקט חדש</h2><div class="form"><input id="pn" class="wide" placeholder="שם הפרויקט"><input id="pc" placeholder="לקוח"><input id="pl" placeholder="מיקום"><input id="pct" type="number" placeholder="סכום חוזה ₪"><input id="pp" type="number" min="0" max="100" placeholder="התקדמות %"></div><p><button class="btn primary" id="addp">שמור פרויקט</button></p></div></div></section><section id="boq" class="view"><div class="card"><h2>הוספת סעיף</h2><div class="form"><input id="bc" placeholder="קטגוריה"><input id="bd" class="wide" placeholder="תיאור סעיף"><input id="bu" placeholder="יחידה"><input id="bq" type="number" placeholder="כמות חוזה"><input id="bp" type="number" placeholder="מחיר יחידה ₪"><input id="baq" type="number" placeholder="כמות שבוצעה"><input id="bac" type="number" placeholder="עלות יחידה בפועל ₪"></div><p><button class="btn primary" id="addb">הוסף לכתב הכמויות</button></p></div><div class="card wrap"><table><thead><tr><th>קטגוריה</th><th>תיאור</th><th>יחידה</th><th>כמות</th><th>מחיר</th><th>תקציב</th><th>כמות בפועל</th><th>בפועל</th><th>סטייה</th><th></th></tr></thead><tbody id="bt"></tbody></table></div></section><section id="cost" class="view"><div class="metrics"><div class="card metric">תקציב<b id="cb">₪0</b></div><div class="card metric">בפועל<b id="ca">₪0</b></div><div class="card metric">סטייה<b id="cv">₪0</b></div><div class="card metric">סעיפים<b id="ci">0</b></div></div><div class="card wrap"><h2>חריגות</h2><table><thead><tr><th>סעיף</th><th>תקציב</th><th>בפועל</th><th>סטייה</th></tr></thead><tbody id="ct"></tbody></table></div></section></main></div><script>const K='segev_boq_work_v1';let S=JSON.parse(localStorage.getItem(K)||'{"projects":[],"selected":null}');const $=id=>document.getElementById(id),m=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(+n||0),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),save=()=>localStorage.setItem(K,JSON.stringify(S)),p=()=>S.projects.find(x=>x.id===S.selected),bud=i=>(+i.q||0)*(+i.p||0),act=i=>(+i.aq||0)*(+i.ac||0),tot=x=>{let z=x?.boq||[],b=z.reduce((s,i)=>s+bud(i),0),a=z.reduce((s,i)=>s+act(i),0);return{b,a,v:b-a}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('title').textContent={dash:'מרכז שליטה',projects:'פרויקטים',boq:'כתב כמויות',cost:'תקציב מול ביצוע'}[v];render()}window.show=show;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.v));function render(){let x=p(),t=tot(x);$('sel').textContent=x?x.name+(x.client?' — '+x.client:''):'אין פרויקט נבחר';$('db').textContent=m(t.b);$('da').textContent=m(t.a);$('dv').textContent=m(t.v);$('dv').className=t.v<0?'bad':'good';$('dp').textContent=(+x?.progress||0)+'%';$('summary').innerHTML=x?'<h2>'+esc(x.name)+'</h2><p>לקוח: '+esc(x.client||'—')+' · מיקום: '+esc(x.location||'—')+'</p><p>סכום חוזה: <b>'+m(x.contract)+'</b></p><p>כתב כמויות: <b>'+x.boq.length+'</b> סעיפים · תקציב: <b>'+m(t.b)+'</b> · ביצוע: <b>'+m(t.a)+'</b></p>':'<div class="empty">צור פרויקט ראשון כדי להתחיל לעבוד.</div>';$('plist').innerHTML=S.projects.length?S.projects.map(q=>'<div class="row '+(q.id===S.selected?'active':'')+'"><div><b>'+esc(q.name)+'</b><div class="sub">'+esc(q.client||'ללא לקוח')+' · '+esc(q.location||'ללא מיקום')+'</div></div><div><button class="btn" onclick="openp(\''+q.id+'\')">פתח</button> <button class="btn danger" onclick="delp(\''+q.id+'\')">מחק</button></div></div>').join(''):'<div class="empty">עדיין אין פרויקטים.</div>';if(!x)$('bt').innerHTML='<tr><td colspan="10" class="empty">בחר פרויקט.</td></tr>';else $('bt').innerHTML=x.boq.length?x.boq.map(i=>{let b=bud(i),a=act(i),v=b-a;return'<tr><td>'+esc(i.c)+'</td><td>'+esc(i.d)+'</td><td>'+esc(i.u)+'</td><td>'+i.q+'</td><td>'+m(i.p)+'</td><td>'+m(b)+'</td><td>'+i.aq+'</td><td>'+m(a)+'</td><td class="'+(v<0?'bad':'good')+'">'+m(v)+'</td><td><button class="btn danger" onclick="delb(\''+i.id+'\')">מחק</button></td></tr>'}).join(''):'<tr><td colspan="10" class="empty">אין סעיפים.</td></tr>';$('cb').textContent=m(t.b);$('ca').textContent=m(t.a);$('cv').textContent=m(t.v);$('cv').className=t.v<0?'bad':'good';$('ci').textContent=x?.boq.length||0;$('ct').innerHTML=x?.boq.length?x.boq.map(i=>{let b=bud(i),a=act(i),v=b-a;return'<tr><td>'+esc(i.d)+'</td><td>'+m(b)+'</td><td>'+m(a)+'</td><td class="'+(v<0?'bad':'good')+'">'+m(v)+'</td></tr>'}).join(''):'<tr><td colspan="4" class="empty">אין נתונים.</td></tr>'}window.openp=z=>{S.selected=z;save();show('dash')};window.delp=z=>{if(confirm('למחוק את הפרויקט וכל הנתונים שלו?')){S.projects=S.projects.filter(x=>x.id!==z);if(S.selected===z)S.selected=S.projects[0]?.id||null;save();render()}};window.delb=z=>{let x=p();if(x){x.boq=x.boq.filter(i=>i.id!==z);save();render()}};$('addp').onclick=()=>{if(!$('pn').value.trim())return alert('יש להזין שם פרויקט');let x={id:id(),name:$('pn').value.trim(),client:$('pc').value.trim(),location:$('pl').value.trim(),contract:+$('pct').value||0,progress:+$('pp').value||0,boq:[]};S.projects.push(x);S.selected=x.id;['pn','pc','pl','pct','pp'].forEach(z=>$(z).value='');save();show('dash')};$('addb').onclick=()=>{let x=p();if(!x)return alert('בחר פרויקט קודם');if(!$('bd').value.trim())return alert('יש להזין תיאור סעיף');x.boq.push({id:id(),c:$('bc').value.trim(),d:$('bd').value.trim(),u:$('bu').value.trim()||'יח',q:+$('bq').value||0,p:+$('bp').value||0,aq:+$('baq').value||0,ac:+$('bac').value||0});['bc','bd','bu','bq','bp','baq','bac'].forEach(z=>$(z).value='');save();render()};$('backup').onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SEGEV_BOQ_backup.json';a.click()};$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.projects))throw 0;S=x;save();render();alert('הגיבוי שוחזר')}catch(e){alert('קובץ לא תקין')}};r.readAsText(f)};render();</script></body></html>
