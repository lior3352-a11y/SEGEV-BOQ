<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEGEV BOQ</title>
<style>body{font-family:Arial,sans-serif;background:#f6f8fb;color:#152033;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center}.spin{width:42px;height:42px;border:4px solid #e4e7ec;border-top-color:#d9952f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="box"><div class="spin"></div><strong>SEGEV BOQ</strong><p>טוען את המערכת...</p></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:7},(_,i)=>`release-v2/part${String(i+1).padStart(2,'0')}.txt?v=20260810`);
    const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
    if(responses.some(r=>!r.ok)) throw new Error('missing release part');
    let html=(await Promise.all(responses.map(r=>r.text()))).join('');
    if(!html.startsWith('<!doctype html>')||!html.includes('SEGEV commercial access')||!html.includes('view-monthly')) throw new Error('release validation failed');

    const guidance='<script src="smart-guidance.js?v=20260811"><\/script>';
    const backControl=`
      <style>
        #segevBackToPresentation{position:fixed;top:14px;left:14px;z-index:99999;background:#0c2233;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:10px 14px;font:700 14px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18)}
        #segevBackToPresentation:hover{background:#12314a}
        @media(max-width:700px){#segevBackToPresentation{top:10px;left:10px;padding:9px 11px;font-size:13px}}
      </style>
      <a id="segevBackToPresentation" href="index.html" aria-label="חזרה למצגת">← חזרה למצגת</a>`;

    const injected=guidance+backControl;
    html=html.includes('</body>')?html.replace('</body>',injected+'</body>'):html+injected;
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="box"><h2>SEGEV BOQ</h2><p>לא ניתן לטעון את גרסת המערכת. יש לרענן את הדף.</p><p><a href="index.html">חזרה למצגת</a></p></div>';console.error(e)}
})();
</script></body></html>
